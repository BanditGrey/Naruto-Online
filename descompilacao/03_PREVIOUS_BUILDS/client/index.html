<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Naruto Online — Web Client (PixiJS)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #f1f5f9;
        user-select: none;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay-ui {
        display: none;
        position: absolute;
        top: 10px;
        left: 10px;
        pointer-events: none;
        z-index: 100;
        font-size: 13px;
        background: rgba(15, 23, 42, 0.75);
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(4px);
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 600;
      }
      .badge-connected { background: #166534; color: #4ade80; }
      .badge-disconnected { background: #991b1b; color: #f87171; }
    </style>
  </head>
  <body>
    <div id="overlay-ui">
      <span>Status: <span id="net-status" class="badge badge-disconnected">Desconectado</span></span>
      <span id="char-status" style="margin-left: 15px; color: #94a3b8;">Nenhum ninja selecionado</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
