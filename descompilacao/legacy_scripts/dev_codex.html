<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Naruto Dev Codex // Runner & Memory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { display: flex; height: 100vh; background: #090d16; color: #adbac7; overflow: hidden; }
    aside { width: 320px; background: #151b23; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
    .aside-header { padding: 14px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    .aside-header h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #58a6ff; }
    .history-list { flex: 1; overflow-y: auto; padding: 10px; }
    .history-card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .history-card:hover { border-color: #58a6ff; background: #161b22; }
    .history-card.active { border-color: #238636; background: #16261c; }
    .card-title { font-size: 12px; font-weight: bold; color: #f0f6fc; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 11px; color: #768390; display: flex; justify-content: space-between; }
    main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow: hidden; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .top-bar h2 { font-size: 16px; color: #f0f6fc; }
    .editor-label { font-size: 12px; color: #768390; margin-bottom: 4px; }
    textarea { width: 100%; height: 160px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #79c0ff; padding: 12px; font-family: Consolas, monospace; font-size: 13px; resize: none; outline: none; }
    textarea:focus { border-color: #58a6ff; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button { padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
    button.primary { background: #238636; color: #fff; }
    button.primary:hover { background: #2ea043; }
    button.blue { background: #1f6feb; color: #fff; }
    button.blue:hover { background: #388bfd; }
    button.sec { background: #21262d; border-color: #30363d; color: #adbac7; }
    button.sec:hover { background: #30363d; color: #f0f6fc; }
    .output-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; color: #768390; }
    pre { flex: 1; background: #010409; border: 1px solid #30363d; border-radius: 6px; padding: 12px; color: #7ee787; font-family: Consolas, monospace; font-size: 12px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <aside>
    <div class="aside-header">
      <h3>Codex Timeline</h3>
      <button class="sec" onclick="clearAllHistory()" style="padding: 4px 8px; font-size: 11px;">Limpar Tudo</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </aside>

  <main>
    <div class="top-bar">
      <h2>Naruto Dev Codex & Executor</h2>
      <span style="font-size: 12px; color: #7ee787;">● Workspace: D:\naruto Online</span>
    </div>

    <div>
      <div class="editor-label">Comando PowerShell / Script de Extração:</div>
      <textarea id="code" placeholder="Cole comandos do PowerShell ou scripts Node aqui..."></textarea>
    </div>

    <div class="actions">
      <button class="primary" onclick="execute()">▶ Executar & Registrar no Codex</button>
      <button id="copyBtn" class="blue" onclick="copyLog()">📋 Copiar Saída</button>
      <button class="sec" onclick="resetEditor()">Novo Comando</button>
    </div>

    <div class="output-container">
      <div class="output-header">
        <span id="execMeta">Log de Saída:</span>
        <span id="charCount">0 caracteres</span>
      </div>
      <pre id="output">Selecione uma tarefa antiga no Codex à esquerda ou execute um novo comando acima.</pre>
    </div>
  </main>

  <script>
    let currentHistory = [];

    async function fetchHistory() {
      const res = await fetch('/api/history');
      currentHistory = await res.json();
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';
      if (currentHistory.length === 0) {
        container.innerHTML = '<div style="padding: 10px; font-size: 12px; color: #545d68; text-align: center;">Nenhum registro ainda.</div>';
        return;
      }
      currentHistory.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.onclick = () => selectItem(idx);
        card.innerHTML = '<div class="card-title">' + escapeHtml(item.command.split('\n')[0]) + '</div>' +
          '<div class="card-meta"><span>#' + (currentHistory.length - idx) + '</span><span>' + new Date(item.timestamp).toLocaleTimeString() + '</span></div>';
        container.appendChild(card);
      });
    }

    function selectItem(idx) {
      document.querySelectorAll('.history-card').forEach((c, i) => {
        c.classList.toggle('active', i === idx);
      });
      const item = currentHistory[idx];
      document.getElementById('code').value = item.command;
      const out = document.getElementById('output');
      out.textContent = item.output || '(Sem saída)';
      document.getElementById('execMeta').textContent = 'Registro de: ' + new Date(item.timestamp).toLocaleString();
      document.getElementById('charCount').textContent = out.textContent.length + ' caracteres';
    }

    async function execute() {
      const code = document.getElementById('code').value;
      if (!code.trim()) return;
      const out = document.getElementById('output');
      out.textContent = 'Executando tarefa no PowerShell...';
      document.getElementById('execMeta').textContent = 'Executando agora...';

      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        out.textContent = data.output || '(Comando finalizado sem saída)';
        document.getElementById('execMeta').textContent = 'Finalizado às ' + new Date().toLocaleTimeString();
        document.getElementById('charCount').textContent = out.textContent.length + ' caracteres';
        await fetchHistory();
        selectItem(0);
      } catch (err) {
        out.textContent = 'Erro ao executar: ' + err.message;
      }
    }

    async function copyLog() {
      const out = document.getElementById('output');
      const btn = document.getElementById('copyBtn');
      await navigator.clipboard.writeText(out.textContent);
      const old = btn.textContent;
      btn.textContent = '✓ Copiado!';
      btn.style.background = '#238636';
      setTimeout(() => {
        btn.textContent = old;
        btn.style.background = '#1f6feb';
      }, 1500);
    }

    function resetEditor() {
      document.getElementById('code').value = '';
      document.getElementById('output').textContent = 'Pronto para novo comando.';
      document.getElementById('execMeta').textContent = 'Novo Comando';
      document.getElementById('charCount').textContent = '0 caracteres';
      document.querySelectorAll('.history-card').forEach(c => c.classList.remove('active'));
    }

    async function clearAllHistory() {
      if (!confirm('Deseja zerar todo o histórico do Codex?')) return;
      await fetch('/api/history', { method: 'DELETE' });
      await fetchHistory();
      resetEditor();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    fetchHistory();
  </script>
</body>
</html>
